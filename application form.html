<!DOCTYPE html>
<html>
<head>
    <title>Student Application Form</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
        }

        form {
            background-color: white;
            width: 350px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
            color: blue;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            background-color: green;
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
        }
    </style>
</head>

<body>

    <form>
        <h2>Student Application Form</h2>

        <label>Student Name:</label>
        <input type="text" placeholder="Enter student name" required>

        <label>Father's Name:</label>
        <input type="text" placeholder="Enter father name">

        <label>Mother's Name:</label>
        <input type="text" placeholder="Enter mother name">

        <label>Mobile Number:</label>
        <input type="tel" placeholder="Enter mobile number">

        <label>Parent Mobile Number:</label>
        <input type="tel" placeholder="Enter parent number">

        <label>Age:</label>
        <input type="number" placeholder="Enter age">

        <label>Marks:</label>
        <input type="number" placeholder="Enter marks">

        <label>Gender:</label>
        <select>
            <option>Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <label>Address:</label>
        <textarea placeholder="Enter address"></textarea>

        <button type="submit">Submit</button>
        <button type="reset" style="background-color:red; margin-top:8px;">Reset</button>
    </form>

</body>
</html>
